<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계산기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .calculator {
            background: #1e1e1e;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 320px;
        }

        .display {
            background: #333;
            color: #fff;
            font-size: 2.5em;
            padding: 20px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 20px;
            min-height: 60px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 20px;
            font-size: 1.5em;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-number {
            background: #444;
            color: #fff;
        }

        .btn-number:hover {
            background: #555;
        }

        .btn-operator {
            background: #667eea;
            color: #fff;
        }

        .btn-operator:hover {
            background: #5568d3;
        }

        .btn-clear {
            background: #ff6b6b;
            color: #fff;
            grid-column: 1 / 2;
        }

        .btn-clear:hover {
            background: #ee5a52;
        }

        .btn-delete {
            background: #ffa502;
            color: #fff;
        }

        .btn-delete:hover {
            background: #e69500;
        }

        .btn-zero {
            grid-column: 1 / 3;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttons">
            <button class="btn btn-clear">C</button>
            <button class="btn btn-delete">←</button>
            <button class="btn btn-operator">÷</button>
            <button class="btn btn-operator">×</button>

            <button class="btn btn-number">7</button>
            <button class="btn btn-number">8</button>
            <button class="btn btn-number">9</button>
            <button class="btn btn-operator">−</button>

            <button class="btn btn-number">4</button>
            <button class="btn btn-number">5</button>
            <button class="btn btn-number">6</button>
            <button class="btn btn-operator">+</button>

            <button class="btn btn-number">1</button>
            <button class="btn btn-number">2</button>
            <button class="btn btn-number">3</button>
            <button class="btn btn-operator">=</button>

            <button class="btn btn-number btn-zero">0</button>
            <button class="btn btn-operator">.</button>
        </div>
    </div>

    <script>
        let display = document.querySelector('.display');
        let buttons = document.querySelectorAll('.btn');
        let expression = '';
        let currentValue = '0';
        let previousValue = '';
        let operator = null;
        let shouldResetDisplay = false;

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.textContent;

                if (button.classList.contains('btn-number')) {
                    handleNumber(value);
                } else if (button.classList.contains('btn-operator')) {
                    handleOperator(value);
                } else if (button.classList.contains('btn-clear')) {
                    handleClear();
                } else if (button.classList.contains('btn-delete')) {
                    handleDelete();
                }

                updateDisplay();
            });
        });

        function handleNumber(value) {
            if (shouldResetDisplay) {
                currentValue = value;
                shouldResetDisplay = false;
            } else {
                if (currentValue === '0' && value !== '.') {
                    currentValue = value;
                } else if (value === '.' && currentValue.includes('.')) {
                    return;
                } else {
                    currentValue += value;
                }
            }
        }

        function handleOperator(value) {
            if (value === '=') {
                if (operator && previousValue !== '') {
                    calculate();
                    expression = currentValue;
                }
            } else {
                if (operator && previousValue !== '' && !shouldResetDisplay) {
                    calculate();
                }
                operator = value;
                previousValue = currentValue;
                expression = previousValue + ' ' + value + ' ';
                shouldResetDisplay = true;
            }
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousValue);
            const current = parseFloat(currentValue);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operator) {
                case '+':
                    result = prev + current;
                    break;
                case '−':
                    result = prev - current;
                    break;
                case '×':
                    result = prev * current;
                    break;
                case '÷':
                    result = current === 0 ? 'Error' : prev / current;
                    break;
                default:
                    return;
            }

            currentValue = result.toString();
            operator = null;
            previousValue = '';
            shouldResetDisplay = true;
        }

        function handleClear() {
            currentValue = '0';
            previousValue = '';
            operator = null;
            expression = '';
            shouldResetDisplay = false;
        }

        function handleDelete() {
            if (currentValue.length > 1) {
                currentValue = currentValue.slice(0, -1);
            } else {
                currentValue = '0';
            }
        }

        function updateDisplay() {
            if (expression) {
                display.textContent = expression + currentValue;
            } else {
                display.textContent = currentValue;
            }
        }
    </script>
</body>
</html>
